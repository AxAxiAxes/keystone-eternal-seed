<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>AXES Contracting | Website in preparation</title>
  <meta name="description" content="The AXES Contracting website is in preparation. Public information will be published after owner approval.">
  <link rel="canonical" href="https://axescontracting.com/">
  <style>
    :root {
      color-scheme: dark;
      --canvas: #091113;
      --ink: #eef3ed;
      --muted: #b7c2b7;
      --line: rgba(238, 243, 237, 0.18);
      --accent: #c8a65a;
      --accent-wash: rgba(200, 166, 90, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      align-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(200, 166, 90, 0.16), transparent 28rem),
        radial-gradient(circle at 82% 78%, rgba(93, 134, 108, 0.18), transparent 30rem),
        var(--canvas);
      color: var(--ink);
      display: flex;
      font-family: Georgia, "Times New Roman", serif;
      margin: 0;
      min-height: 100vh;
      padding: 1.5rem;
    }

    main {
      border: 1px solid var(--line);
      margin: auto;
      max-width: 68rem;
      overflow: hidden;
      padding: clamp(2rem, 7vw, 6rem);
      position: relative;
      width: 100%;
    }

    main::before,
    main::after {
      border: 1px solid var(--accent-wash);
      border-radius: 50%;
      content: "";
      height: 18rem;
      position: absolute;
      width: 18rem;
    }

    main::before { left: -9rem; top: -9rem; }
    main::after { bottom: -10rem; right: -10rem; }

    .identity,
    .eyebrow {
      font-family: Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .identity {
      color: var(--accent);
      font-size: 0.72rem;
      margin: 0 0 clamp(4rem, 12vw, 9rem);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 0.7rem;
      margin: 0 0 1.5rem;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 7.2rem);
      font-weight: 400;
      letter-spacing: -0.065em;
      line-height: 0.86;
      margin: 0;
      max-width: 11ch;
      position: relative;
    }

    .rule {
      background: var(--accent);
      height: 1px;
      margin: 2.25rem 0;
      width: min(11rem, 45%);
    }

    p:last-child {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      line-height: 1.65;
      margin: 0;
      max-width: 38rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="identity">AXES / 001</p>
    <p class="eyebrow">Website in preparation</p>
    <h1>AXES Contracting</h1>
    <div class="rule"></div>
    <p>Public information will be published after owner approval.</p>
  </main>
</body>
</html>
