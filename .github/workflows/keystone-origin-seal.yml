name: "Keystone · Origin Seal"
on:
  push:
    branches: [main]

jobs:
  seal:
    name: Seal Origin Record
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 1

      - name: Record Origin Seal
        uses: actions/github-script@v7
        with:
                    github-token: ${{ steps.token.outputs.token || github.token }}

          script: |
            const sha = context.sha.substring(0, 7);
            const actor = context.actor;
            const ts = new Date().toISOString();
            console.log(`Origin Seal: commit ${sha} by ${actor} at ${ts}`);
            core.summary
              .addHeading('🔑 AXES Keystone Agent — Origin Seal', 2)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Commit', sha],
                ['Actor', actor],
                ['Timestamp', ts],
                ['Branch', 'main'],
              ])
              .write();
