name: "Keystone · Origin Seal"
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seal:
    name: Seal Origin Record
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record Origin Seal
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const actor = context.actor;
            const ts = new Date().toISOString();
            console.log(`Origin Seal: commit ${sha} by ${actor} at ${ts}`);
            core.summary
              .addHeading('🔑 AXES Keystone Agent — Origin Seal', 2)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Commit', sha],
                ['Actor', actor],
                ['Timestamp', ts],
                ['Branch', 'main'],
              ])
              .write();
