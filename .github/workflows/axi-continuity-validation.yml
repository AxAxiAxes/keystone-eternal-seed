name: AXI continuity validation

on:
  push:
    branches:
      - axaxiaxes-axes-directory-data-model
      - axaxiaxes-axiom-monorepo
  pull_request:
    branches:
      - axaxiaxes-axiom-monorepo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axi-continuity-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        application:
          - apps/axiom-engine
          - apps/axiom-freedom
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - run: npm ci
      - if: matrix.application == 'apps/axiom-freedom'
        run: npm ci --prefix ../axiom-engine
      - run: npm test

  axi-core-tests:
    name: AXI.Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test AXIOM.sln --configuration Release
