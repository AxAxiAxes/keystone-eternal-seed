name: "Keystone · Integrity Checks"
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    name: Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify NOTICE.md present
        run: |
          if [ ! -f NOTICE.md ]; then
            echo "NOTICE.md is missing — origin record required."
            exit 1
          fi
          echo "NOTICE.md present — origin integrity confirmed."

      - name: Summarize
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            core.summary
              .addHeading('🔑 AXES Keystone Agent — Integrity Check', 2)
              .addRaw('All integrity checks completed.')
              .write();
