name: "Keystone · Integrity Checks"
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  integrity:
    name: Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Verify NOTICE.md present
        run: |
          if [ ! -f NOTICE.md ]; then
            echo "NOTICE.md is missing — origin record required."
            exit 1
          fi
          echo "NOTICE.md present — origin integrity confirmed."

      - name: Summarize
        if: always()
        uses: actions/github-script@v7
        with:
                    github-token: ${{ steps.token.outputs.token || github.token }}

          script: |
            core.summary
              .addHeading('🔑 AXES Keystone Agent — Integrity Check', 2)
              .addRaw('All integrity checks completed.')
              .write();
